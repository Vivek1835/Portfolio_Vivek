<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - The Locked Chamber</title>
</head>
<body>
    <div class="final-image">
    <img src="Material/picture 5.png" alt="Puzzle 5" id="puzzleImg" style="cursor: pointer;">
    </div>
    <div id="timer">02:00</div>

    <!-- Room Container (shown after click) -->
    <div class="room-container" id="roomContainer" style="display: none;">
        <img src="Material/picture 5.png" alt="Escape Room" class="room-image">
        <div class="game-info">
            <h1>🔒 The Locked Chamber</h1>
            <div class="clue-counter">Clues found: <span id="clueCount">0</span>/4</div>
            <div class="hint">💡 Click around the room to find clues!</div>
            <div class="clues-found" id="cluesFound"></div>
        </div>

        <!-- Clickable hotspots (4 clues) -->
        <div class="hotspot clue1" data-clue="1"></div>
        <div class="hotspot clue2" data-clue="2"></div>
        <div class="hotspot clue3" data-clue="3"></div>
        <div class="hotspot clue4" data-clue="4"></div>

        <!-- Keypad button next to door -->
        <div class="keypad-btn" id="keypadBtn" title="Unlock the door"></div>
    </div>

    <!-- Clue Modal (popup when you find a clue) -->
    <div class="modal" id="clueModal">
        <div class="modal-content">
            <h2 id="clueTitle">clue found!</h2>
            <p id="clueText"></p>
            <div class="digit" id="clueDigit"></div>
            <br><br>
            <button class="close-btn" onclick="closeClueModal()">Continue</button>
        </div>
    </div>

    <!-- Keypad Modal (popup for entering code) -->
    <div class="keypad-modal" id="keypadModal">
        <div class="keypad-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2>🔓 unlock the door</h2>
            <div class="code-display" id="codeDisplay">----</div>
            
            <div class="keypad">
                <button class="key" onclick="addDigit('1')">1</button>
                <button class="key" onclick="addDigit('2')">2</button>
                <button class="key" onclick="addDigit('3')">3</button>
                <button class="key" onclick="addDigit('4')">4</button>
                <button class="key" onclick="addDigit('5')">5</button>
                <button class="key" onclick="addDigit('6')">6</button>
                <button class="key" onclick="addDigit('7')">7</button>
                <button class="key" onclick="addDigit('8')">8</button>
                <button class="key" onclick="addDigit('9')">9</button>
                <button class="key zero" onclick="addDigit('0')">0</button>
            </div>

            <div class="action-btns">
                <button class="clear-btn" onclick="clearCode()">Clear</button>
                <button class="submit-btn" onclick="checkCode()">Unlock</button>
            </div>
            
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- JAVASCRIPT CODE STARTS HERE                 -->
    <!-- ============================================ -->
    <script>
        /* ============================================ */
        /* PUZZLE IMAGE CLICK DETECTION                 */
        /* ============================================ */

        // Get the puzzle image element
        const puzzleImg = document.getElementById('puzzleImg');
        // Get the room container that shows the full puzzle interface
        const roomContainer = document.getElementById('roomContainer');

        // Add click event listener to the puzzle image
        puzzleImg.addEventListener('click', function(event) {
            // Get the position and dimensions of the puzzle image on screen
            const rect = puzzleImg.getBoundingClientRect();
            // Calculate the X position of the mouse click relative to the image
            const x = event.clientX - rect.left;
            // Calculate the Y position of the mouse click relative to the image
            const y = event.clientY - rect.top;
            // Get the width of the image
            const width = rect.width;
            // Get the height of the image
            const height = rect.height;

            // Check if click is in middle area (40% to 60% of width and height)
            if (x > width * 0.4 && x < width * 0.6 && y > height * 0.4 && y < height * 0.6) {
                // Hide the puzzle image
                puzzleImg.style.display = 'none';
                // Show the room container with all the puzzle elements
                roomContainer.style.display = 'block';
            }
        });

        /* ============================================ */
        /* GAME STATE - CLUE TRACKING                   */
        /* ============================================ */

        // Object to track which clues have been found (true/false for clues 1-4)
        let foundClues = {
            1: false,
            2: false,
            3: false,
            4: false
        };
        
        // Object with the digit that each clue reveals (together they make the code)
        let clueDigits = {
            1: '3',  // First digit is 3
            2: '7',  // Second digit is 7
            3: '2',  // Third digit is 2
            4: '9'   // Fourth digit is 9
        };

        // Object with the message text for each clue popup
        let clueMessages = {
            1: 'You found an old book on the shelf. Inside it says: "The first digit in the code is..."',
            2: 'You examine the broken window. There is a number etched into the metal...',
            3: 'You look through the window and see a number drawn in the dust...',
            4: 'On the shelf you find a bottle with a note inside. It says a number...'
        };

        // Variable to store the player's current code entry
        let currentCode = '';
        // The correct code that must be entered to unlock the door (3729)
        const correctCode = '3729';

        /* ============================================ */
        /* HOTSPOT SETUP - CLUE LOCATIONS               */
        /* ============================================ */

        // Get all hotspot elements (the clickable areas for clues)
        document.querySelectorAll('.hotspot').forEach(hotspot => {
            // Add click event listener to each hotspot
            hotspot.addEventListener('click', function() {
                // Get the clue number (1, 2, 3, or 4) from the data-clue attribute
                const clueNum = this.getAttribute('data-clue');
                // Mark this clue as found
                foundClues[clueNum] = true;
                // Add CSS class to show the hotspot has been clicked
                this.classList.add('found');
                // Show the clue popup modal
                showClue(clueNum);
                // Update the clue counter display
                updateClueCount();
            });
        });

        /* ============================================ */
        /* SHOW CLUE MODAL - DISPLAY CLUE POPUP         */
        /* ============================================ */

        // Function to display a clue in the clue modal
        function showClue(clueNum) {
            // Set the clue modal title (e.g., "🔍 clue #1 found!")
            document.getElementById('clueTitle').textContent = '🔍 clue #' + clueNum + ' found!';
            // Set the clue description text
            document.getElementById('clueText').textContent = clueMessages[clueNum];
            // Set the digit that this clue reveals
            document.getElementById('clueDigit').textContent = clueDigits[clueNum];
            // Show the clue modal by setting display to flex
            document.getElementById('clueModal').style.display = 'flex';
        }

        /* ============================================ */
        /* CLOSE CLUE MODAL - HIDE CLUE POPUP           */
        /* ============================================ */

        // Function to close the clue modal
        function closeClueModal() {
            // Hide the clue modal by setting display to none
            document.getElementById('clueModal').style.display = 'none';
        }

        /* ============================================ */
        /* UPDATE CLUE COUNT - TRACK PROGRESS            */
        /* ============================================ */

        // Function to update the clue counter and activate keypad when ready
        function updateClueCount() {
            // Count how many clues have been found (count the true values)
            const count = Object.values(foundClues).filter(v => v).length;
            // Update the clue count display (e.g., "Clues found: 3/4")
            document.getElementById('clueCount').textContent = count;
            
            // Build a string of all found clues and their digits
            let cluesText = '';
            // Loop through clues 1 to 4
            for (let i = 1; i <= 4; i++) {
                // If this clue was found
                if (foundClues[i]) {
                    // Add it to the display string
                    cluesText += 'Siffer ' + i + ': ' + clueDigits[i] + ' ';
                }
            }
            // Update the clues found display on the page
            document.getElementById('cluesFound').textContent = cluesText;

            // If all 4 clues have been found
            if (count === 4) {
                // Add the 'active' CSS class to the keypad button to enable it
                document.getElementById('keypadBtn').classList.add('active');
            }
        }

        /* ============================================ */
        /* KEYPAD BUTTON - OPEN CODE ENTRY              */
        /* ============================================ */

        // Add click event listener to the keypad button
        document.getElementById('keypadBtn').addEventListener('click', function() {
            // Count how many clues have been found
            const count = Object.values(foundClues).filter(v => v).length;
            // Check if all 4 clues have been found
            if (count === 4) {
                // Show the keypad modal
                document.getElementById('keypadModal').style.display = 'flex';
                // Reset the current code
                currentCode = '';
                // Update the code display to show dashes
                updateCodeDisplay();
            } else {
                // Show alert if not all clues found
                alert('You must find all 4 clues first!');
            }
        });

        /* ============================================ */
        /* KEYPAD FUNCTIONS - CODE ENTRY SYSTEM         */
        /* ============================================ */

        // Function to add a digit to the current code
        function addDigit(digit) {
            // Check if the code is not already 4 digits long
            if (currentCode.length < 4) {
                // Add the digit to the current code
                currentCode += digit;
                // Update the display to show the new code
                updateCodeDisplay();
                // Clear any previous error message
                document.getElementById('errorMsg').textContent = '';
            }
        }

        // Function to clear the entire code
        function clearCode() {
            // Reset the current code to empty string
            currentCode = '';
            // Update the display to show empty code (----)
            updateCodeDisplay();
            // Clear any error message
            document.getElementById('errorMsg').textContent = '';
        }

        // Function to update the code display on screen
        function updateCodeDisplay() {
            // Start with the current code
            let display = currentCode;
            // Add dashes to fill it to 4 characters (e.g., "37--" if currentCode is "37")
            while (display.length < 4) {
                display += '-';
            }
            // Update the code display element on the page
            document.getElementById('codeDisplay').textContent = display;
        }

        /* ============================================ */
        /* CHECK CODE - VERIFY SOLUTION                 */
        /* ============================================ */

        // Function to check if the entered code is correct
        function checkCode() {
            // Check if the code is exactly 4 digits long
            if (currentCode.length !== 4) {
                // Show error message if code is not 4 digits
                document.getElementById('errorMsg').textContent = '⚠️ code must have 4 numbers!';
                return;
            }

            // Check if the entered code matches the correct code
            if (currentCode === correctCode) {
                // Save to localStorage that this puzzle has been solved
                localStorage.setItem('puzzle_fifth.html', 'solved');
                // Enable the next button so player can proceed
                enableNext();
                // Move to the next page (sixth.html)
                window.location.href = 'sixth.html';
            } else {
                // Show error message for incorrect code
                document.getElementById('errorMsg').textContent = '❌ wrong code! try again...';
                // Reset the code
                currentCode = '';
                // Update the display back to dashes
                updateCodeDisplay();
            }
        }

        /* ============================================ */
        /* CLOSE KEYPAD MODAL - HIDE CODE ENTRY         */
        /* ============================================ */

        // Function to close the keypad modal
        function closeModal() {
            // Hide the keypad modal by setting display to none
            document.getElementById('keypadModal').style.display = 'none';
            // Reset the current code
            currentCode = '';
            // Update the display back to empty
            updateCodeDisplay();
            // Clear any error message
            document.getElementById('errorMsg').textContent = '';
        }
    </script>

    <!-- JAVASCRIPT CODE ENDS HERE                   -->

    <script>
    /* ============================================ */
    /* PAGE LOAD FADE-IN EFFECT                     */
    /* ============================================ */

    // Listen for when the page has finished loading all content
    document.addEventListener('DOMContentLoaded', () => {
      // Get the final image element
      const finalImage = document.querySelector('.final-image');
      // Make the final image visible by setting opacity to 1
      finalImage.style.opacity = '1';
    });
    </script>

    <div id="navButtons">
      <button id="backBtn">Back</button>
      <button id="nextBtn" disabled>Next</button>
    </div>

    <script>
    /* ============================================ */
    /* NAVIGATION SETUP                             */
    /* ============================================ */

    // Define the current page filename
    const currentPage = 'fifth.html';
    // Array of all pages in the game in order
    const pages = ['index.html', 'second.html', 'third.html', 'fourth.html', 'fifth.html', 'sixth.html'];
    // Find the index of the current page in the pages array
    const currentIndex = pages.indexOf(currentPage);
    // Get the back button element from HTML
    const backBtn = document.getElementById('backBtn');
    // Get the next button element from HTML
    const nextBtn = document.getElementById('nextBtn');

    /* ============================================ */
    /* BACK BUTTON SETUP                            */
    /* ============================================ */

    // Check if we're not on the first page
    if (currentIndex > 0) {
      // Add click event listener to back button
      backBtn.addEventListener('click', () => window.location.href = pages[currentIndex - 1]);
    } else {
      // Disable back button if we're on the first page
      backBtn.disabled = true;
    }

    /* ============================================ */
    /* NEXT BUTTON FUNCTION                         */
    /* ============================================ */

    // Function to enable the next button and its functionality
    function enableNext() {
      // Enable the next button by removing disabled state
      nextBtn.disabled = false;
      // Add click event listener to next button
      nextBtn.addEventListener('click', () => window.location.href = pages[currentIndex + 1]);
    }

    /* ============================================ */
    /* CHECK IF PUZZLE ALREADY SOLVED               */
    /* ============================================ */

    // Check localStorage to see if this puzzle has been solved before
    if (localStorage.getItem('puzzle_' + currentPage) === 'solved') {
      // If puzzle was already solved, enable next button immediately
      enableNext();
    }
    </script>
