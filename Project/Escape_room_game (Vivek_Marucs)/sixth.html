<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: black; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Arial, sans-serif;">
<audio src="Material/haunted-house-ambience-21831.mp3" loop autoplay></audio>
<h1 style="font-size: 4em; color: gold;">🎉 Congratulations! 🎉</h1>
<p style="font-size: 2em;">You have escaped the haunted house!</p>
<p style="font-size: 1.5em;">You are safe now.</p>
<button id="playAgainBtn" style="font-size: 1.5em; padding: 15px 30px; background: gold; color: black; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px;">Play Again</button>
<div id="timer">02:00</div>
<script>
/* ============================================ */
/* PLAY AGAIN BUTTON FUNCTIONALITY              */
/* ============================================ */

// Add click event listener to the "Play Again" button
document.getElementById('playAgainBtn').addEventListener('click', function() {
  // Remove the stored timer end time from localStorage to reset the timer
  localStorage.removeItem('timerEndTime');
  // Redirect back to the start of the game (index.html)
  window.location.href = 'index.html';
});
</script>

<div id="navButtons">
  <button id="backBtn">Back</button>
</div>

<script>
/* ============================================ */
/* NAVIGATION SETUP                             */
/* ============================================ */

// Define the current page filename
const currentPage = 'sixth.html';
// Array of all pages in the game in order
const pages = ['index.html', 'second.html', 'third.html', 'fourth.html', 'fifth.html', 'sixth.html'];
// Find the index of the current page in the pages array
const currentIndex = pages.indexOf(currentPage);
// Get the back button element from HTML
const backBtn = document.getElementById('backBtn');

/* ============================================ */
/* BACK BUTTON SETUP                            */
/* ============================================ */

// Check if we're not on the first page
if (currentIndex > 0) {
  // Add click event listener to back button
  backBtn.addEventListener('click', () => window.location.href = pages[currentIndex - 1]);
} else {
  // Disable back button if we're on the first page
  backBtn.disabled = true;
}

/* ============================================ */
/* NOTE: NO NEXT BUTTON                         */
/* ============================================ */

// This is the final page of the game, so there is no next button
</script>
<script src="timer.js"></script>
</body>
</html>
