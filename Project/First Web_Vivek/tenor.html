<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dancing cat</title>
    <style>
        body {
            color: #ffffff;
            background: #222;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        p {
            font-size: 2em;
            margin-top: 40px;
            margin-bottom: 40px;
        }
        .cat-row {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            gap: 60px;
            margin-top: 100px; /* Add this line to move the cats down */
        }
        .cat-row img {
            width: 500px;
            height: auto;
            border: 5px solid #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <p>Happy Happy Happy because they got chocolate</p>
    <div class="cat-row">
        <img src="Happy happy happy cat.gif" alt="Gray cat standing on hind legs, dancing joyfully in a home environment, expressing a playful and happy mood">
        <img src="tenor.gif" alt="Gray cat standing on hind legs, dancing joyfully in a home environment, expressing a playful and happy mood">
    </div>
</body>
</html>
