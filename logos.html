<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Logos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="/material/portfolio_logo.svg">
</head>
<body>
    <header class="logo_heading">
    <h1>Logos made by me</h1>
</header>
<section class="logos_section">
  <div class="logos-grid">

    <figure class="logo-item">
      <div class="logo-media">
        <img src="/material/Portfolio_logo 2.svg" alt="Improved portfolio logo">
      </div>
      <figcaption class="logo-text">
        <h3>Improved portfolio logo</h3>
        <p>This is an improved version of my portfolio logo. I refined the shapes, colors, and typography to create a cleaner and more modern look. 
            The updated design better represents my growth, creativity, and interest in web development and technology.</p>
      </figcaption>
    </figure>

    <figure class="logo-item">
      <div class="logo-media">
        <img src="/material/portfolio_logo.svg" alt="First portfolio logo">
      </div>
      <figcaption class="logo-text">
        <h3>First portfolio logo</h3>
        <p>This is the very first logo I created for my portfolio. I designed it using simple shapes and basic tools, focusing on learning the fundamentals of logo design. 
            It represents the starting point of my journey as a web developer and IT student.</p>
      </figcaption>
    </figure>

    <figure class="logo-item">
      <div class="logo-media">
        <img src="/material/Oppdrag-2 LOGONew better Final logo.svg" alt="Client logo">
      </div>
      <figcaption class="logo-text">
        <h3>Økern Basketball Logo</h3>
        <p>This logo was created as part of a project assignment. The goal was to design a logo that feels strong, energetic, and suitable for a sports team. 
            Through this project, I learned how to adapt my design style to match a specific theme, audience, and purpose..</p>
      </figcaption>
    </figure>

    <figure class="logo-item">
      <div class="logo-media">
        <img src="/material/Shapes and logos_ony logo.svg" alt="Collection of shapes and logos">
      </div>
      <figcaption class="logo-text">
        <h3>First Logo</h3>
        <p>This logo is part of a small collection of experimental designs where I explored different shapes, layouts, and visual ideas.
             It reflects my creativity and willingness to try new styles while improving my understanding of basic design principles.</p>
      </figcaption>
    </figure>

  </div>
</section>
</body>
</html>
